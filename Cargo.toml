[package]
name = "mowbite-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
