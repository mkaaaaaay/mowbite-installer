[package]
name = "mowbite-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1"
getrandom = "0.2"
ext4-view = "=1.0.0"
mdns-sd = "0.13"
rpassword = "7"
nusb = "0.2"
rockfile = "0.1"
rockusb = { version = "=0.4.0", default-features = false, features = ["nusb"] }
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }
