[package]
name = "mowbite-installer"
version = "0.3.1"
edition = "2024"
rust-version = "1.92"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1"
ext4-view = "=1.0.0"
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
mdns-sd = "0.13"
nusb = "0.2"
qrcode = { version = "=0.15.0", default-features = false, features = ["std", "svg"] }
rockfile = "0.1"
rockusb = { version = "=0.4.0", default-features = false, features = ["nusb"] }
rpassword = "7"
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
zstd = "0.13"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
overflow-checks = true

[patch.crates-io]
ext4-view = { path = "vendor/ext4-view" }
