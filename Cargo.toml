[package]
name = "mowbite-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
