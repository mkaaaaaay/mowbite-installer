<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What the installer reads and writes on the flash of the Tron</title>
  <rect width="960" height="232" rx="16" fill="#101114"/>

  <rect x="20" y="20" width="294" height="12" rx="6" fill="#5b9df0"/>
  <rect x="333" y="20" width="294" height="12" rx="6" fill="#d4ac4a"/>
  <rect x="646" y="20" width="294" height="12" rx="6" fill="#3a3d47"/>

  <g>
    <rect x="20" y="46" width="294" height="166" rx="12" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="36" y="78" font-size="12" font-weight="600" fill="#5b9df0" letter-spacing="0.6">READ TWICE</text>
    <text x="36" y="110" font-size="18" font-weight="600" fill="#f1f1f1">Start areas</text>
    <g font-size="13" fill="#9a9ba0">
      <text x="36" y="136">Loader, U-Boot, kernel and recovery.</text>
      <text x="36" y="155">They keep the USB mode reachable.</text>
    </g>
    <text x="36" y="193" font-size="12" font-weight="600" fill="#4cbf72" letter-spacing="0.6">NEVER WRITTEN</text>
  </g>

  <g>
    <rect x="333" y="46" width="294" height="166" rx="12" fill="#241f12" stroke="#d4ac4a" stroke-width="1.5"/>
    <text x="349" y="78" font-size="12" font-weight="600" fill="#d4ac4a" letter-spacing="0.6">READ TWICE</text>
    <text x="349" y="110" font-size="18" font-weight="600" fill="#f1f1f1">System partition</text>
    <g font-size="13" fill="#c9bf9f">
      <text x="349" y="136">MowBite OS goes here, and the vendor</text>
      <text x="349" y="155">system from your backup on the way back.</text>
    </g>
    <text x="349" y="193" font-size="12" font-weight="600" fill="#d4ac4a" letter-spacing="0.6">THE ONLY AREA WRITTEN</text>
  </g>

  <g>
    <rect x="646" y="46" width="294" height="166" rx="12" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="662" y="78" font-size="12" font-weight="600" fill="#9a9ba0" letter-spacing="0.6">READ ONCE</text>
    <text x="662" y="110" font-size="18" font-weight="600" fill="#f1f1f1">Everything else</text>
    <g font-size="13" fill="#9a9ba0">
      <text x="662" y="136">The rest of the flash, with the data</text>
      <text x="662" y="155">of the vendor system.</text>
    </g>
    <text x="662" y="193" font-size="12" font-weight="600" fill="#4cbf72" letter-spacing="0.6">NEVER WRITTEN</text>
  </g>
</svg>
